<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadyKomunidad — Padre Garcia El Niño AI Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }

        /* Custom elevated typing dots with brand glow */
        @keyframes dotBounce {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.35;
            }
            50% {
                transform: translateY(-7px) scale(1.15);
                opacity: 1;
                filter: drop-shadow(0 4px 6px rgba(249, 115, 22, 0.45));
            }
        }

        .animate-dot-1 { animation: dotBounce 1.1s infinite ease-in-out; }
        .animate-dot-2 { animation: dotBounce 1.1s infinite ease-in-out 0.2s; }
        .animate-dot-3 { animation: dotBounce 1.1s infinite ease-in-out 0.4s; }

        /* Subtle shimmering gradient for the thinking status */
        @keyframes shimmerText {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .animate-shimmer { animation: shimmerText 1.6s infinite ease-in-out; }

        /* Lightbox / image modal */
        #image-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            padding: 1.5rem;
        }
        #image-lightbox.open { display: flex; }
        #image-lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 14px;
            object-fit: contain;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .chat-img-thumb {
            cursor: zoom-in;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .chat-img-thumb:hover { transform: scale(1.015); opacity: 0.95; }
        /* Rainfall Bar Chart Tooltips */
.bar-group:hover .bar-tooltip {
    opacity: 1;
    transform: translateY(-4px);
}
    </style>
</head>
<body class="bg-slate-50 dark:bg-[#0c111d] text-slate-800 dark:text-slate-100 h-full flex flex-col font-sans transition-colors duration-200 antialiased overflow-hidden">

    <!-- Top Minimal Navigation -->
    <header class="w-full border-b border-slate-200/80 dark:border-slate-800/80 bg-white/70 dark:bg-[#0c111d]/70 backdrop-blur-md px-4 sm:px-8 py-3.5 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <!-- Sun Logo Icon -->
            <div class="relative w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-500 to-amber-400 flex items-center justify-center text-white shadow-sm shadow-brand-500/25">
                <i class="fa-solid fa-sun text-base animate-spin" style="animation-duration: 25s;"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <span class="font-semibold text-slate-900 dark:text-white text-sm sm:text-base tracking-tight">ReadyKomunidad</span>
                    <span class="text-[10px] font-medium tracking-wide uppercase px-2 py-0.5 rounded-md bg-brand-50 dark:bg-brand-950/60 text-brand-600 dark:text-brand-400 border border-brand-200/60 dark:border-brand-800/50">Padre Garcia</span>
                </div>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="toggleDarkMode()" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800/60 rounded-xl transition-colors text-xs flex items-center gap-1.5" title="Toggle Dark/Light Mode">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
            <button onclick="clearChat()" class="px-3 py-1.5 text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/60 rounded-xl transition-colors text-xs font-medium flex items-center gap-1.5 border border-slate-200/80 dark:border-slate-700/60 shadow-xs" title="Start new conversation">
                <i class="fa-solid fa-plus text-[11px]"></i>
                <span>New Chat</span>
            </button>
        </div>
    </header>

    <!-- Main Chat Workspace -->
    <main class="flex-1 max-w-3xl w-full mx-auto flex flex-col overflow-hidden px-3 sm:px-6 pt-2 pb-3">
        
        <!-- Messages Area / Welcome Screen -->
        <div id="chat-messages" class="flex-1 overflow-y-auto px-1 sm:px-2 py-4 space-y-6">
            <!-- Dynamically populated by JS (either Welcome Hero or Chat Messages) -->
        </div>

        <!-- Floating Scroll-To-Bottom Button -->
        <div class="relative w-full flex justify-end">
            <button id="scroll-to-bottom-btn"
                onclick="scrollToBottom()"
                title="Jump to latest"
                class="hidden absolute -top-12 right-2 z-20 w-8 h-8 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 shadow-md hover:shadow-lg flex items-center justify-center transition-all hover:scale-105 active:scale-95">
                <i class="fa-solid fa-arrow-down text-xs"></i>
            </button>
        </div>

        <!-- Chat Input & Bottom Disclaimer -->
        <div class="pt-2 shrink-0">
            <form id="chat-form" onsubmit="handleUserSubmit(event)" class="relative flex items-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm focus-within:border-brand-500/60 focus-within:ring-2 focus-within:ring-brand-500/10 transition-all p-1.5">
                <input type="text" id="user-input" autocomplete="off"
                    placeholder="Ask about El Niño, rainfall forecast, water tips, or emergency contacts..."
                    class="w-full bg-transparent px-3.5 py-2.5 text-sm outline-none text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500">
                <button type="submit" id="send-btn"
                    class="w-10 h-10 rounded-xl bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 hover:bg-brand-500 dark:hover:bg-brand-500 dark:hover:text-white flex items-center justify-center transition-all duration-150 shrink-0 cursor-pointer disabled:opacity-40">
                    <i class="fa-solid fa-arrow-up text-sm"></i>
                </button>
            </form>

            <!-- Bottom Disclaimer -->
            <p class="text-[11px] text-center text-slate-400 dark:text-slate-500 mt-2.5 px-4 leading-normal">
                ReadyKomunidad can make mistakes. Please verify official weather advisories and emergency directives with PAGASA or local authorities.
            </p>
        </div>
    </main>

    <!-- Image Lightbox Modal -->
    <div id="image-lightbox" onclick="closeLightbox(event)">
        <span class="absolute top-5 right-6 text-white text-2xl font-light cursor-pointer hover:opacity-75 transition-opacity" onclick="closeLightbox(event)">&times;</span>
        <img id="lightbox-img" src="" alt="Full preview">
    </div>

    <script>
        // Store conversation messages
        let messages = [];

        // Unique conversation session identifier
        let sessionId = localStorage.getItem('rk_session_id') || '';
        function newSessionId() {
            sessionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'sess-' + Date.now();
            localStorage.setItem('rk_session_id', sessionId);
        }
        if (!sessionId) { newSessionId(); }

        const chatMessagesEl = document.getElementById('chat-messages');
        const userInputEl = document.getElementById('user-input');
        const chatFormEl = document.getElementById('chat-form');
        const scrollBottomBtn = document.getElementById('scroll-to-bottom-btn');

        window.onload = async function() {
            // Restore previous session if exists
            if (sessionId) {
                try {
                    const res = await fetch('/api/history?session_id=' + encodeURIComponent(sessionId));
                    const data = await res.json();
                    if (data.messages && data.messages.length > 0) {
                        messages = data.messages;
                    }
                } catch (e) {
                    messages = [];
                }
            }
            renderMessages();
        };

        function getCurrentTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Render either empty welcome screen or active message list
        function renderMessages() {
            chatMessagesEl.innerHTML = '';

            if (messages.length === 0) {
                renderWelcomeScreen();
                return;
            }

            messages.forEach((msg) => {
                const isBot = msg.sender === 'bot';
                const messageWrapper = document.createElement('div');
                messageWrapper.className = `flex flex-col animate-fade-in ${isBot ? 'items-start' : 'items-end'}`;

                let bubbleStyle = isBot
                    ? 'bg-transparent text-slate-800 dark:text-slate-100 max-w-full sm:max-w-[92%]'
                    : 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-2xl rounded-br-sm px-4 py-2.5 max-w-[85%] sm:max-w-[75%] border border-slate-200/60 dark:border-slate-700/50 shadow-2xs';

                const botHeader = isBot ? `
                    <div class="flex items-center gap-2 mb-1.5 text-xs text-slate-400 dark:text-slate-500 font-medium">
                        <i class="fa-solid fa-sun text-[11px] text-amber-500"></i>
                        <span>ReadyKomunidad</span>
                        <span>•</span>
                        <span>${msg.time || ''}</span>
                        <button onclick="copyMessage(this)" data-text="${escapeQuotes(msg.text)}" class="hover:text-brand-500 transition-colors ml-1 p-0.5" title="Copy text">
                            <i class="fa-regular fa-copy text-[11px]"></i>
                        </button>
                    </div>
                ` : '';

                messageWrapper.innerHTML = `
                    ${botHeader}
                    <div class="${bubbleStyle} text-sm leading-relaxed">
                        ${formatMarkdown(msg.text)}
                    </div>
                    ${!isBot ? `<div class="text-[10px] text-slate-400 dark:text-slate-500 mt-1 mr-1">${msg.time || ''}</div>` : ''}
                `;

                chatMessagesEl.appendChild(messageWrapper);
            });

            scrollToBottom();
        }

        function escapeQuotes(str) {
            return (str || '')
                .replace(/"/g, '&quot;')
                .replace(/\n/g, '&#10;');
        }

        // Clean, minimal initial welcome state with Sun Logo
        function renderWelcomeScreen() {
            const welcomeDiv = document.createElement('div');
            welcomeDiv.className = 'h-full flex flex-col justify-center items-center text-center max-w-xl mx-auto px-2 py-6 animate-fade-in select-none';
            welcomeDiv.innerHTML = `
                <!-- Sole Sun Logo -->
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-500 to-amber-400 flex items-center justify-center text-white shadow-lg shadow-brand-500/25 mb-5">
                    <i class="fa-solid fa-sun text-2xl animate-spin" style="animation-duration: 25s;"></i>
                </div>
                
                <h2 class="text-2xl sm:text-3xl font-semibold text-slate-900 dark:text-white tracking-tight mb-2.5">
                    Hello! How can I help you today?
                </h2>
                
                <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed mb-8 max-w-md">
                    Ask about El Niño, local preparedness, rainfall information, and community assistance in Padre Garcia, Batangas.
                </p>

                <!-- Modern Minimalist Prompt Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full text-left">
                    <button onclick="sendQuickPrompt('What is El Niño?')" 
                        class="p-3.5 rounded-xl border border-slate-200/80 dark:border-slate-800 bg-white/70 dark:bg-slate-900/60 hover:border-brand-500/60 dark:hover:border-brand-500/60 hover:bg-white dark:hover:bg-slate-900 transition-all text-xs group flex items-start gap-3 shadow-2xs">
                        <span class="text-base text-amber-500 group-hover:scale-110 transition-transform mt-0.5"><i class="fa-solid fa-sun"></i></span>
                        <div>
                            <span class="font-medium text-slate-800 dark:text-slate-200 block mb-0.5">What is El Niño?</span>
                            <span class="text-slate-400 dark:text-slate-500 text-[11px] block">Understand causes, mechanics & local risks</span>
                        </div>
                    </button>

                    <button onclick="sendQuickPrompt('What should I do during El Niño?')" 
                        class="p-3.5 rounded-xl border border-slate-200/80 dark:border-slate-800 bg-white/70 dark:bg-slate-900/60 hover:border-brand-500/60 dark:hover:border-brand-500/60 hover:bg-white dark:hover:bg-slate-900 transition-all text-xs group flex items-start gap-3 shadow-2xs">
                        <span class="text-base text-sky-500 group-hover:scale-110 transition-transform mt-0.5"><i class="fa-solid fa-faucet-drip"></i></span>
                        <div>
                            <span class="font-medium text-slate-800 dark:text-slate-200 block mb-0.5">Preparedness</span>
                            <span class="text-slate-400 dark:text-slate-500 text-[11px] block">Action tips for households & farmers</span>
                        </div>
                    </button>

                    <button onclick="sendQuickPrompt('Predict rain for May')" 
                        class="p-3.5 rounded-xl border border-slate-200/80 dark:border-slate-800 bg-white/70 dark:bg-slate-900/60 hover:border-brand-500/60 dark:hover:border-brand-500/60 hover:bg-white dark:hover:bg-slate-900 transition-all text-xs group flex items-start gap-3 shadow-2xs">
                        <span class="text-base text-emerald-500 group-hover:scale-110 transition-transform mt-0.5"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
                        <div>
                            <span class="font-medium text-slate-800 dark:text-slate-200 block mb-0.5">Predict Rainfall for May</span>
                            <span class="text-slate-400 dark:text-slate-500 text-[11px] block">AI forecasting for Padre Garcia</span>
                        </div>
                    </button>

                    <button onclick="sendQuickPrompt('Who to contact during an El Niño emergency?')" 
                        class="p-3.5 rounded-xl border border-slate-200/80 dark:border-slate-800 bg-white/70 dark:bg-slate-900/60 hover:border-brand-500/60 dark:hover:border-brand-500/60 hover:bg-white dark:hover:bg-slate-900 transition-all text-xs group flex items-start gap-3 shadow-2xs">
                        <span class="text-base text-rose-500 group-hover:scale-110 transition-transform mt-0.5"><i class="fa-solid fa-phone-volume"></i></span>
                        <div>
                            <span class="font-medium text-slate-800 dark:text-slate-200 block mb-0.5">Emergency & LGU Contacts</span>
                            <span class="text-slate-400 dark:text-slate-500 text-[11px] block">MDRRMO, RHU & emergency hotlines</span>
                        </div>
                    </button>
                </div>
            `;
            chatMessagesEl.appendChild(welcomeDiv);
        }

        // Send query to Flask backend
        async function handleUserSubmit(e) {
            if (e) e.preventDefault();
            const text = userInputEl.value.trim();
            if (!text) return;

            // Append user turn
            messages.push({ sender: 'user', text: text, time: getCurrentTime() });
            userInputEl.value = '';
            renderMessages();

            // High-visibility typing indicator with Sun Avatar
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typing-indicator';
            typingDiv.className = 'flex items-start gap-3 animate-fade-in my-2';
            typingDiv.innerHTML = `
                <!-- Sun Bot Avatar with Pulse Ring -->
                <div class="relative w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-500 to-amber-400 flex items-center justify-center text-white text-xs shadow-md shadow-brand-500/20 shrink-0 mt-0.5">
                    <i class="fa-solid fa-sun text-sm animate-spin" style="animation-duration: 20s;"></i>
                    <span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-amber-400 rounded-full animate-ping"></span>
                </div>

                <!-- Modern Bubble with Glowing Bouncing Dots -->
                <div class="bg-white dark:bg-slate-900 border border-brand-200/80 dark:border-brand-900/60 rounded-2xl rounded-tl-sm px-4 py-3 shadow-xs flex items-center gap-3">
                    <span class="text-xs font-medium text-brand-600 dark:text-brand-400 animate-shimmer flex items-center gap-1.5">
                        <i class="fa-solid fa-sparkles text-[11px]"></i>
                        <span>Thinking</span>
                    </span>
                    <span class="w-px h-3.5 bg-slate-200 dark:bg-slate-800"></span>
                    <div class="flex items-center gap-1.5 pt-1">
                        <span class="w-2.5 h-2.5 bg-brand-500 rounded-full animate-dot-1"></span>
                        <span class="w-2.5 h-2.5 bg-amber-500 rounded-full animate-dot-2"></span>
                        <span class="w-2.5 h-2.5 bg-brand-600 rounded-full animate-dot-3"></span>
                    </div>
                </div>
            `;
            chatMessagesEl.appendChild(typingDiv);
            scrollToBottom();

            try {
                // Keep animation visibly active for at least 750ms so user clearly notices it
                const [response] = await Promise.all([
                    fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text, session_id: sessionId })
                    }),
                    new Promise(resolve => setTimeout(resolve, 750))
                ]);
                const data = await response.json();

                if (data.session_id) {
                    sessionId = data.session_id;
                    localStorage.setItem('rk_session_id', sessionId);
                }

                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();

                messages.push({ sender: 'bot', text: data.reply, time: getCurrentTime() });
                renderMessages();

            } catch (err) {
                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();
                messages.push({ sender: 'bot', text: "⚠️ Unable to connect to the chatbot server. Please check your connection.", time: getCurrentTime() });
                renderMessages();
            }
        }

        function sendQuickPrompt(promptText) {
            userInputEl.value = promptText;
            handleUserSubmit();
        }

        function clearChat() {
            newSessionId();
            messages = [];
            renderMessages();
        }

        // Markdown text & image parser
        // Markdown text, card & image parser
        function formatMarkdown(text) {
            if (!text) return '';

            // If the message contains an embedded HTML card (<!-- RAINFALL_CARD -->),
            // render it directly without line-break munging
            if (text.includes('<!-- RAINFALL_CARD -->')) {
                return text;
            }

            let result = text
                .replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>')
                .replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-slate-900 dark:text-white">$1</strong>')
                .replace(/\*(.*?)\*/g, '<em class="italic text-slate-600 dark:text-slate-300">$1</em>');

            const lines = result.split('\n');
            const processed = [];
            let imgBuffer = [];

            function flushImages() {
                if (imgBuffer.length === 0) return;
                processed.push(
                    `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 my-2.5">` +
                    imgBuffer.join('') +
                    `</div>`
                );
                imgBuffer = [];
            }

            lines.forEach(line => {
                const imgMatch = line.match(/^!\[([^\]]*)\]\((https?:\/\/[^\)]+)\)$/);
                if (imgMatch) {
                    const alt = imgMatch[1].replace(/'/g, "\\'");
                    const src = imgMatch[2];
                    imgBuffer.push(
                        `<img src="${src}" alt="${imgMatch[1]}" class="chat-img-thumb w-full h-36 object-cover rounded-xl border border-slate-200/80 dark:border-slate-800" onclick="openLightbox('${src}')" onerror="this.style.display='none'">`
                    );
                } else {
                    flushImages();
                    processed.push(line);
                }
            });
            flushImages();

            return processed.join('<br>');
        }

        function openLightbox(src) {
            const box = document.getElementById('image-lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            box.classList.add('open');
        }

        function closeLightbox(e) {
            const box = document.getElementById('image-lightbox');
            box.classList.remove('open');
            document.getElementById('lightbox-img').src = '';
        }

        function scrollToBottom() {
            chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        }

        chatMessagesEl.addEventListener('scroll', function () {
            const dist = chatMessagesEl.scrollHeight - chatMessagesEl.scrollTop - chatMessagesEl.clientHeight;
            if (dist > 120 && messages.length > 0) {
                scrollBottomBtn.classList.remove('hidden');
            } else {
                scrollBottomBtn.classList.add('hidden');
            }
        });

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('theme-icon');
            icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        function copyMessage(btn) {
            const raw = btn.getAttribute('data-text') || '';
            const plain = raw
                .replace(/!\[.*?\]\(.*?\)/g, '')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/\*(.*?)\*/g, '$1');
            navigator.clipboard.writeText(plain).then(() => {
                const icon = btn.querySelector('i');
                icon.className = 'fa-solid fa-check text-[11px] text-emerald-500';
                setTimeout(() => { icon.className = 'fa-regular fa-copy text-[11px]'; }, 1800);
            });
        }
    </script>
</body>
</html>
